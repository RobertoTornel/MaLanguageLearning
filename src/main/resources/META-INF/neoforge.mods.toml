# 26.x form: javafml is the default loader. `license` is required.
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
iconFile = "icon.png"
description = '''
${mod_description}

WARNING: THIS MOD DOWNLOADS A LARGE SPEECH-RECOGNITION MODEL (ABOUT 671 MB FOR THE
INT8 PARAKEET V3 MODEL, ABOUT 2.5 GB FOR FULL PRECISION) PLUS A SMALL PYTHON RUNTIME.
IT REQUIRES A MICROPHONE, EXPECTS ROUGHLY 1-3 GB OF SYSTEM RAM WHILE ACTIVE, AND CAN
USE EITHER THE CPU OR A CUDA GPU (TOGGLABLE). IT HAS A NOTICEABLE PERFORMANCE IMPACT.
NOTHING IS DOWNLOADED UNTIL YOU ACCEPT THE IN-GAME WARNING.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
