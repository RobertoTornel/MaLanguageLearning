# 26.x form: javafml is the default loader. `license` is required.
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
iconFile = "icon.png"
description = '''
${mod_description}

WARNING: This mod downloads a large speech-recognition model (~800 MB; up to ~2.5 GB more
for Japanese, Chinese or Korean) plus a small Python runtime. It requires a microphone,
expects roughly 1-3 GB of system RAM while active, can use CPU or a CUDA GPU (togglable),
and has a noticeable performance impact. Nothing is downloaded until you accept the
in-game warning.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
