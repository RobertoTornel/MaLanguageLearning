[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "malanguage-server"
version = "1.0.0"
description = "Local speech-to-text, text-to-speech and transliteration sidecar for the MaLanguageLearning Minecraft mod."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MaLanguageLearning" }]
keywords = ["minecraft", "asr", "stt", "tts", "speech", "transliteration"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# --- Core runtime (installed by `uv pip install` from the mod's provisioning step) ----
# Deliberately minimal: no torch, no scipy, no pyworld, no librosa, no espeak system deps.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "onnx-asr>=0.10",
    "onnxruntime>=1.18",
    "numpy>=1.24",
    "soundfile>=0.12",
    "pykakasi>=2.2",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
# Whisper fallback for languages parakeet-v3 cannot do (ja, zh, ko, ar, hi, tr, vi, th, ...).
# Without this extra the server still starts; /transcribe answers 503 with a clear message.
whisper = ["faster-whisper>=1.0"]
# Optional pinyin for Chinese transliteration (falls back to plain text when absent).
zh = ["pypinyin>=0.51"]
# GPU wheels for onnxruntime. Optional: the server degrades to CPU when unavailable.
cuda = ["onnxruntime-gpu>=1.18"]
# Piper's Japanese voice needs its own phonemizer; without it /synthesize returns 404.
# (Chinese and Thai voices need the same treatment -- see README.)
ja-tts = ["pyopenjtalk-plus>=0.4"]
# Everything that makes ja/zh/ko/ar/hi/tr/vi/th speech *and* speech output work.
full = ["faster-whisper>=1.0", "pypinyin>=0.51", "pyopenjtalk-plus>=0.4"]

[project.scripts]
malanguage-server = "malanguage_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["malanguage_server"]

[tool.hatch.build.targets.sdist]
include = ["malanguage_server", "README.md", "pyproject.toml"]
